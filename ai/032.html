<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>032 - クレーンゲーム（タイミング）</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>032. クレーンゲーム（タイミング）</h1>
  <div class="info" id="st">景品の上でボタンを押せ！</div><canvas id="c" width="360" height="220"></canvas><button onclick="drop()">キャッチ！</button>
  <script>const c=document.getElementById('c'),x=c.getContext('2d');let cx=20,dir=3,cy=20,state=0,tx=220;
  function drop(){if(state===0)state=1;}
  function loop(){if(state===0){cx+=dir;if(cx<20||cx>340)dir*=-1;}
  else if(state===1){cy+=4;if(cy>=170)state=2;}
  else if(state===2){cy-=4;if(cy<=20){st.textContent=Math.abs(cx-tx)<22?'🎉 ゲット！':'外れ...';tx=60+Math.random()*240;state=0;}}
  x.clearRect(0,0,360,220);x.fillStyle='#f59e0b';x.fillRect(tx-15,175,30,30);
  x.strokeStyle='#333';x.beginPath();x.moveTo(cx,0);x.lineTo(cx,cy);x.stroke();x.fillRect(cx-12,cy,24,10);requestAnimationFrame(loop);}
  loop();</script>
</body>
</html>
