<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>079 - お寿司早握り</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>079. お寿司早握り</h1>
  <div class="info">注文: <span id="ord" style="font-size:24px"></span> ／ 売上: <span id="sc">0</span>皿</div><button onclick="make('🍣')">🍣 まぐろ</button><button onclick="make('🍤')">🍤 えび</button><button onclick="make('🥚')">🥚 たまご</button>
  <script>const menu=['🍣','🍤','🥚'];let cur='',sc=0;function next(){cur=menu[Math.floor(Math.random()*3)];ord.textContent=cur;}
  function make(v){if(v===cur){sc++;document.getElementById('sc').textContent=sc;next();}}
  next();</script>
</body>
</html>
