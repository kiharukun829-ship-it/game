<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>001 - マルバツゲーム（CPU対戦）</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
.board{display:grid;grid-template-columns:repeat(3,80px);gap:4px;justify-content:center}.cell{width:80px;height:80px;border:1px solid #333;font-size:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}</style>
</head>
<body>
  <h1>001. マルバツゲーム（CPU対戦）</h1>
  <div class="info" id="st">あなたの番（○）</div><div class="board" id="b"></div><button onclick="reset()">リセット</button>
  <script>let b=Array(9).fill(''),act=true;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function reset(){b.fill('');act=true;st.textContent='あなたの番（○）';render();}
  function render(){const el=document.getElementById('b');el.innerHTML='';b.forEach((v,i)=>{const d=document.createElement('div');d.className='cell';d.textContent=v;d.onclick=()=>play(i);el.appendChild(d);});}
  function play(i){if(!act||b[i])return;b[i]='○';render();if(check('○'))return;act=false;st.textContent='CPU思考中...';setTimeout(cpu,300);}
  function cpu(){let m=find('×')??find('○')??(b[4]===''?4:null);if(m===null){const e=b.map((v,i)=>v===''?i:null).filter(v=>v!==null);m=e[Math.floor(Math.random()*e.length)];}b[m]='×';render();if(!check('×')){act=true;st.textContent='あなたの番（○）';}}
  function find(p){for(const[a,c,d]of wins){const l=[b[a],b[c],b[d]];if(l.filter(x=>x===p).length===2&&l.includes(''))return b[a]===''?a:b[c]===''?c:d;}return null;}
  function check(p){if(wins.some(([a,c,d])=>b[a]===p&&b[c]===p&&b[d]===p)){st.textContent=(p==='○'?'勝ち！':'CPUの勝ち');act=false;return true;}if(!b.includes('')){st.textContent='引き分け';act=false;return true;}return false;}
  reset();</script>
</body>
</html>
