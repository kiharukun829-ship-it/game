<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>014 - 四目並べ（コネクト4）</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
.g{display:grid;grid-template-columns:repeat(7,44px);gap:4px;justify-content:center}.c{width:44px;height:44px;border:1px solid #333;border-radius:50%;cursor:pointer}.p1{background:#ef4444}.p2{background:#eab308}</style>
</head>
<body>
  <h1>014. 四目並べ（コネクト4）</h1>
  <div class="info" id="st">あなたの番（赤）</div><div class="g" id="g"></div><button onclick="init()">リセット</button>
  <script>let b,ov;function init(){b=Array.from({length:6},()=>Array(7).fill(0));ov=false;st.textContent='あなたの番（赤）';draw();}
  function drop(c,p){for(let r=5;r>=0;r--)if(!b[r][c]){b[r][c]=p;return r;}return -1;}
  function win(p){for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=0;for(let i=0;i<4;i++){const nr=r+dr*i,nc=c+dc*i;if(nr>=0&&nr<6&&nc>=0&&nc<7&&b[nr][nc]===p)k++;}if(k===4)return true;}return false;}
  function draw(){const g=document.getElementById('g');g.innerHTML='';for(let r=0;r<6;r++)for(let c=0;c<7;c++){const d=document.createElement('div');d.className='c'+(b[r][c]===1?' p1':b[r][c]===2?' p2':'');
  d.onclick=()=>{if(ov||drop(c,1)<0)return;draw();if(win(1)){st.textContent='あなたの勝ち！';ov=true;return;}
  let cols=[0,1,2,3,4,5,6].filter(x=>!b[0][x]);if(cols.length){drop(cols[Math.floor(Math.random()*cols.length)],2);draw();if(win(2)){st.textContent='CPUの勝ち';ov=true;}}};g.appendChild(d);}}
  init();</script>
</body>
</html>
