<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>024 - 10秒連打チャレンジ</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>024. 10秒連打チャレンジ</h1>
  <div class="info">残り: <span id="tm">10.0</span>秒 ／ 連打数: <span id="sc">0</span></div><button id="tap" style="width:200px;height:100px;font-size:22px" onclick="hit()">連打！</button><br><button onclick="reset()">リセット</button>
  <script>let sc=0,run=false,tm=10,iv;function reset(){clearInterval(iv);sc=0;run=false;tm=10;document.getElementById('sc').textContent=0;document.getElementById('tm').textContent='10.0';}
  function hit(){if(tm<=0)return;if(!run){run=true;iv=setInterval(()=>{tm=Math.max(0,tm-0.1);document.getElementById('tm').textContent=tm.toFixed(1);if(tm<=0)clearInterval(iv);},100);}sc++;document.getElementById('sc').textContent=sc;}</script>
</body>
</html>
