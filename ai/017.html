<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>017 - 簡易数独（4×4）</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
table{border-collapse:collapse;margin:0 auto}td{width:45px;height:45px;border:1px solid #333}input{width:40px;height:40px;border:none;text-align:center;font-size:20px}</style>
</head>
<body>
  <h1>017. 簡易数独（4×4）</h1>
  <div class="info" id="st">1〜4の数字を入れよう</div><table id="g"></table><button onclick="chk()">答え合わせ</button><button onclick="init()">別問題</button>
  <script>const sols=[[1,2,3,4,3,4,1,2,2,1,4,3,4,3,2,1],[2,4,1,3,3,1,4,2,4,3,2,1,1,2,3,4]];let sol;
  function init(){sol=sols[Math.floor(Math.random()*sols.length)];st.textContent='1〜4の数字を入れよう';const g=document.getElementById('g');g.innerHTML='';
  for(let r=0;r<4;r++){const tr=document.createElement('tr');for(let c=0;c<4;c++){const td=document.createElement('td'),i=r*4+c;
  if(Math.random()<0.45){td.textContent=sol[i];td.style.fontWeight='bold';}else{const inp=document.createElement('input');inp.maxLength=1;inp.dataset.i=i;td.appendChild(inp);}tr.appendChild(td);}g.appendChild(tr);}}
  function chk(){const inps=[...document.querySelectorAll('input')];const ok=inps.every(x=>Number(x.value)===sol[x.dataset.i]);st.textContent=ok?'🎉 正解！':'間違いがあります';}
  init();</script>
</body>
</html>
