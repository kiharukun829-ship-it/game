<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>068 - 簡易ドラムパッド</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>068. 簡易ドラムパッド</h1>
  <div class="info">ボタンまたは 1〜4 キーで音を鳴らそう</div><button onclick="tone(120)">1: キック</button><button onclick="tone(260)">2: スネア</button><button onclick="tone(520)">3: ハイハット</button><button onclick="tone(440)">4: シンセ</button>
  <script>const ac=new (window.AudioContext||window.webkitAudioContext)();
  function tone(f){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.25);o.stop(ac.currentTime+0.25);}
  document.onkeydown=e=>{if(e.key==='1')tone(120);if(e.key==='2')tone(260);if(e.key==='3')tone(520);if(e.key==='4')tone(440);};</script>
</body>
</html>
