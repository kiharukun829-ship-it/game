<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>020 - カラーフラッド</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
.g{display:grid;grid-template-columns:repeat(8,34px);gap:1px;justify-content:center}.c{width:34px;height:34px}</style>
</head>
<body>
  <h1>020. カラーフラッド</h1>
  <div class="info">残り手数: <span id="mv">15</span> <span id="st"></span></div><div class="g" id="g"></div><div id="btns" style="margin-top:10px"></div><button onclick="init()">リセット</button>
  <script>const cols=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7'];let b,mv;
  function init(){b=Array.from({length:64},()=>Math.floor(Math.random()*5));mv=15;st.textContent='';draw();}
  function flood(nc){const oc=b[0];if(oc===nc||mv<=0)return;mv--;const vis=new Set();
  function dfs(i){if(vis.has(i)||b[i]!==oc)return;vis.add(i);b[i]=nc;const r=i>>3,c=i&7;if(r>0)dfs(i-8);if(r<7)dfs(i+8);if(c>0)dfs(i-1);if(c<7)dfs(i+1);}
  dfs(0);draw();if(b.every(v=>v===nc))st.textContent='🎉 クリア！';else if(mv===0)st.textContent='手数切れ';}
  function draw(){document.getElementById('mv').textContent=mv;const g=document.getElementById('g');g.innerHTML='';
  b.forEach(v=>{const d=document.createElement('div');d.className='c';d.style.background=cols[v];g.appendChild(d);});
  const bt=document.getElementById('btns');bt.innerHTML='';cols.forEach((col,i)=>{const btn=document.createElement('button');btn.style.background=col;btn.style.width='36px';btn.style.height='28px';btn.onclick=()=>flood(i);bt.appendChild(btn);});}
  init();</script>
</body>
</html>
