<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>010 - ポン（CPU対戦）</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>010. ポン（CPU対戦）</h1>
  <div class="info">あなた <span id="p1">0</span> - <span id="p2">0</span> CPU</div><canvas id="c" width="480" height="320"></canvas>
  <script>const c=document.getElementById('c'),x=c.getContext('2d');let py=130,cy=130,bx=240,by=160,dx=4,dy=3,s1=0,s2=0;
  c.onmousemove=e=>{const r=c.getBoundingClientRect();py=Math.max(0,Math.min(260,e.clientY-r.top-30));};
  function rBall(){bx=240;by=160;dx=-dx;dy=(Math.random()-0.5)*6;}
  function loop(){bx+=dx;by+=dy;if(by<6||by>314)dy*=-1;
  cy+=(by-(cy+30))*0.08;
  if(bx<22&&by>py&&by<py+60&&dx<0)dx*=-1.05;
  if(bx>458&&by>cy&&by<cy+60&&dx>0)dx*=-1.05;
  if(bx<0){s2++;document.getElementById('p2').textContent=s2;rBall();}
  if(bx>480){s1++;document.getElementById('p1').textContent=s1;rBall();}
  x.clearRect(0,0,480,320);x.fillStyle='#222';x.fillRect(10,py,10,60);x.fillRect(460,cy,10,60);
  x.beginPath();x.arc(bx,by,6,0,7);x.fill();}
  setInterval(loop,16);</script>
</body>
</html>
