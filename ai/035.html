<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>035 - バランスバー</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>035. バランスバー</h1>
  <div class="info">バランス時間: <span id="sc">0.0</span>秒</div><canvas id="c" width="360" height="240"></canvas><button onclick="init()">リセット</button><p>左右キーで傾きを補正</p>
  <script>const c=document.getElementById('c'),x=c.getContext('2d');let ang,vel,k={},t0,ov;
  function init(){ang=0.05;vel=0;t0=performance.now();ov=false;}
  document.onkeydown=e=>k[e.code]=true;document.onkeyup=e=>k[e.code]=false;
  function loop(){if(!ov){if(k.ArrowLeft)vel-=0.002;if(k.ArrowRight)vel+=0.002;vel+=Math.sin(ang)*0.003;ang+=vel;
  if(Math.abs(ang)>1.3)ov=true;else document.getElementById('sc').textContent=((performance.now()-t0)/1000).toFixed(1);}
  x.clearRect(0,0,360,240);x.save();x.translate(180,200);x.rotate(ang);x.fillStyle='#222';x.fillRect(-4,-140,8,140);x.restore();
  if(ov){x.fillStyle='#ef4444';x.font='bold 24px sans-serif';x.textAlign='center';x.fillText('倒れた！',180,120);}requestAnimationFrame(loop);}
  init();loop();</script>
</body>
</html>
