<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>063 - しりとり単語数チャレンジ</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>063. しりとり単語数チャレンジ</h1>
  <div class="info">前の単語の最後の文字から始まる言葉を入力（ひらがな）</div><div id="cur" style="font-size:28px;margin:15px">りんご</div><input id="in" style="font-size:18px"><button onclick="sub()">送信</button><div>記録: <span id="sc">0</span>語</div>
  <script>let last='ご',used=new Set(['りんご']),sc=0;
  function sub(){const v=document.getElementById('in').value.trim();if(!v||v[0]!==last||v.endsWith('ん')||used.has(v)){alert('ルール違反！（繋がらない・ん終わり・既出）');return;}
  used.add(v);last=v[v.length-1];cur.textContent=v;sc++;document.getElementById('sc').textContent=sc;document.getElementById('in').value='';}</script>
</body>
</html>
