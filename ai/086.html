<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>086 - ボールバウンス維持</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>086. ボールバウンス維持</h1>
  <div class="info">リフティング回数: <span id="sc">0</span></div><canvas id="c" width="320" height="380"></canvas>
  <script>const c=document.getElementById('c'),x=c.getContext('2d');let bx=160,by=100,vx=0,vy=0,sc=0;
  c.onmousedown=e=>{const r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(Math.hypot(mx-bx,my-by)<35){vy=-9;vx=(bx-mx)*0.2;sc++;document.getElementById('sc').textContent=sc;}};
  function loop(){vy+=0.35;bx+=vx;by+=vy;if(bx<20||bx>300)vx*=-1;if(by>360){by=100;vy=0;vx=0;sc=0;document.getElementById('sc').textContent=0;}
  x.clearRect(0,0,320,380);x.fillStyle='#ef4444';x.beginPath();x.arc(bx,by,20,0,7);x.fill();requestAnimationFrame(loop);}
  loop();</script>
</body>
</html>
