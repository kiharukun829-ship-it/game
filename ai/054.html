<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>054 - 瞬間数字記憶</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>054. 瞬間数字記憶</h1>
  <div class="info" id="st">数字を覚えて入力しよう</div><div id="disp" style="font-size:32px;margin:15px"></div><input id="in" style="font-size:20px;text-align:center"><button onclick="chk()">回答</button><button onclick="start()">出題</button>
  <script>let ans='',len=4;function start(){ans=Array.from({length:len},()=>Math.floor(Math.random()*10)).join('');disp.textContent=ans;document.getElementById('in').value='';setTimeout(()=>disp.textContent='????',1200);}
  function chk(){if(document.getElementById('in').value===ans){len++;st.textContent=`正解！次は${len}桁`;start();}else{st.textContent=`不正解（答え:${ans}）`;len=4;}}
  start();</script>
</body>
</html>
