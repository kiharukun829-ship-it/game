<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>053 - 文字の色当て（ストループ検査）</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>053. 文字の色当て（ストループ検査）</h1>
  <div class="info">文字の「色」を選べ！（意味に騙されるな）</div><div id="w" style="font-size:40px;font-weight:bold;margin:15px"></div><div id="btns"></div><div>スコア: <span id="sc">0</span></div>
  <script>const items=[{n:'あか',c:'red'},{n:'あお',c:'blue'},{n:'みどり',c:'green'},{n:'きいろ',c:'orange'}];let cur,sc=0;
  items.forEach(it=>{const b=document.createElement('button');b.textContent=it.n;b.onclick=()=>{if(it.c===cur)sc++;else sc=0;document.getElementById('sc').textContent=sc;next();};btns.appendChild(b);});
  function next(){const t=items[Math.floor(Math.random()*4)],col=items[Math.floor(Math.random()*4)];cur=col.c;w.textContent=t.n;w.style.color=col.c;}
  next();</script>
</body>
</html>
