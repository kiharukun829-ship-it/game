<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>052 - かけ算タイムアタック</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>052. かけ算タイムアタック</h1>
  <div class="info">正解数: <span id="sc">0</span></div><div id="q" style="font-size:28px;margin:15px"></div><input id="in" type="number" style="font-size:20px;width:100px;text-align:center">
  <script>let ans,sc=0;function next(){const a=Math.floor(Math.random()*9)+2,b=Math.floor(Math.random()*9)+2;ans=a*b;q.textContent=`${a} × ${b} = ?`;document.getElementById('in').value='';}
  document.getElementById('in').oninput=e=>{if(Number(e.target.value)===ans){sc++;document.getElementById('sc').textContent=sc;next();}};
  next();</script>
</body>
</html>
