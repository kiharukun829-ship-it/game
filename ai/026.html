<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>026 - タイピングゲーム</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>026. タイピングゲーム</h1>
  <div class="info">スコア: <span id="sc">0</span></div><div id="word" style="font-size:32px;letter-spacing:4px;margin:15px"></div><input id="in" autofocus style="font-size:20px;text-align:center">
  <script>const ws=['apple','banana','cherry','dragon','elephant','forest','guitar','island','jungle','knight','lemon','mountain','ocean','planet','rocket','sunset','tiger','universe','volcano','wizard'];
  let sc=0,cur='';function next(){cur=ws[Math.floor(Math.random()*ws.length)];word.textContent=cur;document.getElementById('in').value='';}
  document.getElementById('in').oninput=e=>{if(e.target.value.trim().toLowerCase()===cur){sc++;document.getElementById('sc').textContent=sc;next();}};
  next();</script>
</body>
</html>
