<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>069 - ミニピアノ鍵盤</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>069. ミニピアノ鍵盤</h1>
  <div class="info">ドレミファソラシドを演奏しよう</div><div id="keys"></div>
  <script>const notes=[['ド',261.6],['レ',293.7],['ミ',329.6],['ファ',349.2],['ソ',392.0],['ラ',440.0],['シ',493.9],['ド',523.3]];
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  notes.forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.style.height='100px';b.onclick=()=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.4);o.stop(ac.currentTime+0.4);};keys.appendChild(b);});</script>
</body>
</html>
