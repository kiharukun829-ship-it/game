<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>050 - 石取りゲーム（ニム）</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>050. 石取りゲーム（ニム）</h1>
  <div class="info">残りの石: <span id="st">15</span>個（最後の1個を取ったら負け）</div><div id="msg" style="margin:12px"></div><button onclick="take(1)">1個取る</button><button onclick="take(2)">2個取る</button><button onclick="take(3)">3個取る</button><button onclick="init()">リセット</button>
  <script>let st;function init(){st=15;document.getElementById('st').textContent=st;msg.textContent='1〜3個取ってください';}
  function take(n){if(st<=0)return;st=Math.max(0,st-n);if(st===0){document.getElementById('st').textContent=0;msg.textContent='最後の1個を取りました…あなたの負け';return;}
  const cpu=Math.min(st,Math.floor(Math.random()*3)+1);st-=cpu;document.getElementById('st').textContent=st;
  msg.textContent=st===0?`CPUが${cpu}個取って自滅！あなたの勝ち！`:`CPUが${cpu}個取りました`;}
  init();</script>
</body>
</html>
