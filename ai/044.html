<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>044 - ロシアンルーレット</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>044. ロシアンルーレット</h1>
  <div class="info" id="st">6発中1発が実弾。引き金を引く？</div><button onclick="pull()">引き金を引く</button><button onclick="init()">リセット</button>
  <script>let ch,cur,ov;function init(){ch=Math.floor(Math.random()*6);cur=0;ov=false;st.textContent='6発中1発が実弾。引き金を引く？';}
  function pull(){if(ov)return;if(cur===ch){st.textContent='💥 バン！アウト！';ov=true;}else{cur++;st.textContent=`カチッ...セーフ（${cur}/5回クリア）`;if(cur===5){st.textContent='🎉 完全生還！';ov=true;}}}
  init();</script>
</body>
</html>
