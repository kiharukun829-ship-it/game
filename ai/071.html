<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>071 - クッキークリッカー風</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>071. クッキークリッカー風</h1>
  <div class="info">所持クッキー: <span id="c">0</span>枚（毎秒 +<span id="cps">0</span>）</div><button style="font-size:28px;padding:15px" onclick="c++;upd()">🍪 焼く</button><br><button onclick="buy(10,1)">オーブン購入(10枚: +1/秒)</button><button onclick="buy(50,6)">工場購入(50枚: +6/秒)</button>
  <script>let c=0,cps=0;function upd(){document.getElementById('c').textContent=c;document.getElementById('cps').textContent=cps;}
  function buy(cost,add){if(c>=cost){c-=cost;cps+=add;upd();}}
  setInterval(()=>{c+=cps;upd();},1000);</script>
</body>
</html>
