<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>040 - コイントス予想</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>040. コイントス予想</h1>
  <div class="info">所持金: <span id="m">100</span>円</div><div id="res" style="font-size:24px;margin:15px">表か裏か？</div><button onclick="flip(0)">表（オモテ）</button><button onclick="flip(1)">裏（ウラ）</button>
  <script>let m=100;function flip(g){if(m<10)return;const r=Math.floor(Math.random()*2);if(r===g){m+=10;res.textContent=(r?'裏':'表')+'！当たり +10円';}else{m-=10;res.textContent=(r?'裏':'表')+'！ハズレ -10円';}document.getElementById('m').textContent=m;}</script>
</body>
</html>
