<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>076 - 植物水やり育成</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>076. 植物水やり育成</h1>
  <div class="info">成長度: <span id="gr">0</span>% ／ 水分: <span id="wt">50</span>%</div><div id="pl" style="font-size:48px;margin:15px">🌱</div><button onclick="water()">💧 水をやる</button>
  <script>let gr=0,wt=50;function water(){wt=Math.min(100,wt+30);upd();}
  function upd(){document.getElementById('gr').textContent=gr;document.getElementById('wt').textContent=wt;pl.textContent=gr>=100?'🌻':gr>=50?'🌿':'🌱';}
  setInterval(()=>{if(wt>0&&gr<100){wt-=5;gr=Math.min(100,gr+5);upd();}},1000);</script>
</body>
</html>
