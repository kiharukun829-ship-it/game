<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>011 - 2048パズル</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
.g{display:grid;grid-template-columns:repeat(4,65px);gap:6px;justify-content:center}.c{width:65px;height:65px;border:1px solid #333;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;background:#f5f5f5}</style>
</head>
<body>
  <h1>011. 2048パズル</h1>
  <div class="info">スコア: <span id="sc">0</span></div><div class="g" id="g"></div><button onclick="init()">リセット</button><p>矢印キーでスライド</p>
  <script>let b,sc;function init(){b=Array.from({length:4},()=>Array(4).fill(0));sc=0;add();add();draw();}
  function add(){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!b[r][c])e.push([r,c]);if(e.length){const[r,c]=e[Math.floor(Math.random()*e.length)];b[r][c]=Math.random()<0.9?2:4;}}
  function slide(row){let a=row.filter(v=>v);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;sc+=a[i];a.splice(i+1,1);}while(a.length<4)a.push(0);return a;}
  document.onkeydown=e=>{let old=JSON.stringify(b);
  if(e.key==='ArrowLeft')b=b.map(r=>slide(r));
  if(e.key==='ArrowRight')b=b.map(r=>slide([...r].reverse()).reverse());
  if(e.key==='ArrowUp')for(let c=0;c<4;c++){const col=slide([b[0][c],b[1][c],b[2][c],b[3][c]]);for(let r=0;r<4;r++)b[r][c]=col[r];}
  if(e.key==='ArrowDown')for(let c=0;c<4;c++){const col=slide([b[3][c],b[2][c],b[1][c],b[0][c]]).reverse();for(let r=0;r<4;r++)b[r][c]=col[r];}
  if(old!==JSON.stringify(b)){add();draw();}};
  function draw(){document.getElementById('sc').textContent=sc;const g=document.getElementById('g');g.innerHTML='';b.flat().forEach(v=>{const d=document.createElement('div');d.className='c';d.textContent=v||'';if(v)d.style.background='#ffe8cc';g.appendChild(d);});}
  init();</script>
</body>
</html>
