<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>021 - モグラたたき</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
.g{display:grid;grid-template-columns:repeat(3,80px);gap:8px;justify-content:center}.h{width:80px;height:80px;border:1px solid #333;font-size:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#f5f5f5}</style>
</head>
<body>
  <h1>021. モグラたたき</h1>
  <div class="info">スコア: <span id="sc">0</span> ／ 残り: <span id="tm">20</span>秒</div><div class="g" id="g"></div><button onclick="start()">スタート</button>
  <script>let sc=0,tm=20,active=-1,t1,t2;const g=document.getElementById('g');
  for(let i=0;i<9;i++){const d=document.createElement('div');d.className='h';d.onclick=()=>{if(i===active){sc++;document.getElementById('sc').textContent=sc;active=-1;render();}};g.appendChild(d);}
  function render(){[...g.children].forEach((d,i)=>d.textContent=i===active?'🐹':'');}
  function start(){sc=0;tm=20;document.getElementById('sc').textContent=0;clearInterval(t1);clearInterval(t2);
  t1=setInterval(()=>{active=Math.floor(Math.random()*9);render();},650);
  t2=setInterval(()=>{tm--;document.getElementById('tm').textContent=tm;if(tm<=0){clearInterval(t1);clearInterval(t2);active=-1;render();}},1000);}</script>
</body>
</html>
