<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>027 - ルーレット目押し</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>027. ルーレット目押し</h1>
  <div class="info">スコア: <span id="sc">0</span></div><div id="num" style="font-size:48px;margin:15px">7</div><button onclick="stop()">「7」で止めろ！</button>
  <script>let n=1,sc=0,run=true;setInterval(()=>{if(run){n=n%9+1;num.textContent=n;}},90);
  function stop(){if(!run)return;run=false;if(n===7){sc+=100;document.getElementById('sc').textContent=sc;alert('大当たり！');}setTimeout(()=>run=true,600);}</script>
</body>
</html>
