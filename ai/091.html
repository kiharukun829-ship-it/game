<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>091 - 数字合計10メイク</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
.g{display:grid;grid-template-columns:repeat(4,55px);gap:6px;justify-content:center}.c{width:55px;height:55px;border:1px solid #333;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}</style>
</head>
<body>
  <h1>091. 数字合計10メイク</h1>
  <div class="info">2枚選んで合計「10」にしよう！ スコア: <span id="sc">0</span></div><div class="g" id="g"></div>
  <script>let nums,sel=[],sc=0;function init(){nums=Array.from({length:16},()=>Math.floor(Math.random()*9)+1);draw();}
  function draw(){const g=document.getElementById('g');g.innerHTML='';nums.forEach((v,i)=>{const d=document.createElement('div');d.className='c';d.textContent=v;if(sel.includes(i))d.style.background='#fef08a';
  d.onclick=()=>{if(sel.includes(i))return;sel.push(i);if(sel.length===2){if(nums[sel[0]]+nums[sel[1]]===10){sc+=10;document.getElementById('sc').textContent=sc;sel.forEach(idx=>nums[idx]=Math.floor(Math.random()*9)+1);}sel=[];}draw();};g.appendChild(d);});}
  init();</script>
</body>
</html>
