<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>062 - 四則演算シンボル当て</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>062. 四則演算シンボル当て</h1>
  <div class="info">？に入る記号を選べ スコア: <span id="sc">0</span></div><div id="q" style="font-size:28px;margin:15px"></div><button onclick="ans('+')">＋</button><button onclick="ans('-')">－</button><button onclick="ans('*')">×</button>
  <script>let op,sc=0;function next(){const a=Math.floor(Math.random()*12)+2,b=Math.floor(Math.random()*12)+2,ops=['+','-','*'];op=ops[Math.floor(Math.random()*3)];
  const r=op==='+'?a+b:op==='-'?a-b:a*b;q.textContent=`${a} ？ ${b} = ${r}`;}
  function ans(v){if(v===op)sc++;else sc=0;document.getElementById('sc').textContent=sc;next();}
  next();</script>
</body>
</html>
