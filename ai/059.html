<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>059 - じゃんけん後出し負けゲーム</title>
<style>
  body { font-family: sans-serif; margin: 20px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .info { margin-bottom: 10px; font-size: 16px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; margin: 4px; }
  canvas { border: 1px solid #333; display: block; margin: 0 auto; }
  p { font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>059. じゃんけん後出し負けゲーム</h1>
  <div class="info">相手の手に「わざと負ける」手を出せ！ スコア: <span id="sc">0</span></div><div id="cpu" style="font-size:44px;margin:15px"></div><button onclick="play(0)">✊</button><button onclick="play(1)">✌️</button><button onclick="play(2)">🖐</button>
  <script>const h=['✊','✌️','🖐'];let c,sc=0;function next(){c=Math.floor(Math.random()*3);cpu.textContent=h[c];}
  function play(p){if((p-c+3)%3===1)sc++;else sc=0;document.getElementById('sc').textContent=sc;next();}
  next();</script>
</body>
</html>
